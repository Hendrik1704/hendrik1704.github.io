name: Update software list

on:
  schedule:
    # Every Monday at 06:15 UTC
    - cron: '15 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-repos:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest repository list from GitHub
        working-directory: scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python fetch_repos.py

      - name: Commit and push changes if the dataset changed
        run: |
          if git diff --quiet -- data/repos.json; then
            echo "No changes to data/repos.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/repos.json
          git commit -m "Update software repository list"
          git push
