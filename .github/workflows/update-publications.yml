name: Update publications

on:
  schedule:
    # Every Monday at 06:00 UTC
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-publications:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch latest publications from InspireHEP
        working-directory: scripts
        run: python inspireHep.py

      - name: Commit and push changes if the dataset changed
        run: |
          if git diff --quiet -- data/publications.json; then
            echo "No changes to data/publications.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/publications.json
          git commit -m "Update publications data"
          git push
